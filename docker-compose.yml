services:
  ek-scraper:
    build: .
    container_name: ek-scraper
    init: true
    restart: unless-stopped
    environment:
      - CRON_SCHEDULE=*/15 * * * *
      - RUN_ON_START=false
    volumes:
      - ./configs:/app/configs:ro
      - ek-scraper-data:/app/data

volumes:
  ek-scraper-data:
